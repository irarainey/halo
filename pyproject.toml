[project]
name = "halo"
version = "0.0.1"
description = "HALO — HTTP API Language for Operations. Monorepo workspace."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "halo-fastapi",
    "halo-sample-api",
]

[dependency-groups]
dev = [
    "poethepoet>=0.41.0",
    "mypy>=1.19.1",
    "ruff>=0.15.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
]

[tool.uv]
prerelease = "allow"

# The agent-framework and semantic-kernel extras for halo-fastapi have
# conflicting transitive dependencies (azure-ai-projects) and are never
# installed together.
conflicts = [
    [
        { package = "halo-fastapi", extra = "agent-framework" },
        { package = "halo-fastapi", extra = "semantic-kernel" },
    ],
]

[tool.uv.workspace]
members = ["halo-fastapi", "samples/servers/*", "samples/agents/*"]
exclude = ["samples/agents/agent-framework", "samples/agents/semantic-kernel"]

[tool.uv.sources]
halo-fastapi = { workspace = true }
halo-sample-api = { workspace = true }

# ── Poe tasks ───────────────────────────────────────────────────

[tool.poe.tasks]

[tool.poe.tasks.lint]
help = "Run all linting (ruff check + mypy)"
sequence = ["lint:ruff", "lint:mypy"]

[tool.poe.tasks."lint:ruff"]
help = "Run ruff linter and formatter check"
sequence = [
    { cmd = "ruff check halo-fastapi/ samples/" },
    { cmd = "ruff format --check halo-fastapi/ samples/" },
]

[tool.poe.tasks."lint:mypy"]
help = "Run mypy type checking"
cmd = "mypy halo-fastapi/ samples/"

[tool.poe.tasks.format]
help = "Auto-fix ruff lint issues and format code"
sequence = [
    { cmd = "ruff check --fix halo-fastapi/ samples/" },
    { cmd = "ruff format halo-fastapi/ samples/" },
]

[tool.poe.tasks.build]
help = "Build the halo-fastapi package"
cmd = "uv build --package halo-fastapi"

[tool.poe.tasks.test]
help = "Run unit tests"
cmd = "pytest halo-fastapi/tests/ -v"

[tool.poe.tasks."sync:maf"]
help = "Sync dependencies for Agent Framework development"
sequence = [
    { cmd = "uv sync --all-packages --reinstall" },
    { cmd = "uv pip install -e samples/agents/agent-framework" },
]

[tool.poe.tasks."sync:sk"]
help = "Sync dependencies for Semantic Kernel development"
sequence = [
    { cmd = "uv sync --all-packages --reinstall" },
    { cmd = "uv pip install -e samples/agents/semantic-kernel" },
]

[tool.poe.tasks.api]
help = "Start the sample API on port 3010"
cmd = "uvicorn sample_api.main:app --reload --port 3010"
cwd = "samples/servers/fastapi/src"
envfile = ".env"

[tool.poe.tasks.maf]
help = "Start the Agent Framework DevUI (requires sample API)"
cmd = "python -m sample_agent_framework.main"
cwd = "samples/agents/agent-framework/src"
envfile = ".env"

[tool.poe.tasks.sk]
help = "Start the Semantic Kernel CLI chat (requires sample API)"
cmd = "python -m sample_semantic_kernel.main"
cwd = "samples/agents/semantic-kernel/src"
envfile = ".env"

# ── Ruff ────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py313"
line-length = 140
src = ["halo-fastapi/src", "samples/servers/fastapi/src", "samples/agents/agent-framework/src", "samples/agents/semantic-kernel/src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print (flag bare prints)
    "RUF",   # ruff-specific rules
]
ignore = [
]

[tool.ruff.lint.isort]
known-first-party = ["halo_fastapi", "sample_api", "sample_agent_framework", "sample_semantic_kernel"]

# ── Pytest ──────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["halo-fastapi/tests"]
asyncio_mode = "auto"

# ── Mypy ────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.13"
mypy_path = ["halo-fastapi/src", "samples/servers/fastapi/src", "samples/agents/agent-framework/src", "samples/agents/semantic-kernel/src"]
packages = ["halo_fastapi", "sample_api", "sample_agent_framework", "sample_semantic_kernel"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true