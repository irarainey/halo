[project]
name = "halo-sample-api"
version = "0.0.1"
description = "Sample FastAPI server showcasing the HALO protocol with halo-fastapi."
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "halo-fastapi",
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.41.0",
    "python-dotenv>=1.2.1",
    "pydantic-settings>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_api"]
