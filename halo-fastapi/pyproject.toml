[project]
name = "halo-fastapi"
version = "0.2.0"
description = "HALO — HTTP API Language for Operations. FastAPI plugin for self-describing APIs for LLM agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "aiohttp>=3.13.3",
    "pydantic<2.12",
]

[project.optional-dependencies]
agent-framework = ["agent-framework-core>=1.0.0rc3"]
semantic-kernel = ["semantic-kernel>=1.40.0"]

[project.urls]
Homepage = "https://github.com/irarainey/halo"
Repository = "https://github.com/irarainey/halo"
Documentation = "https://github.com/irarainey/halo/blob/main/README.md"
Changelog = "https://github.com/irarainey/halo/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_fastapi"]
