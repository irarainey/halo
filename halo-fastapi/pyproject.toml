[project]
name = "halo-fastapi"
version = "0.0.1"
description = "HALO — HTTP API Language for Operations. FastAPI plugin for self-describing APIs for LLM agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.129.0",
    "aiohttp>=3.13.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
agent-framework = ["agent-framework-core>=1.0.0rc2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_fastapi"]
